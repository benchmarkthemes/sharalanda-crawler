name: Crawl Shopify Theme Details

on:
  schedule:
    - cron: '30 3 * * *' # daily at 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-theme-details
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Job-level so the step's `if` can see it; a step-level env is not visible
    # to its own condition.
    env:
      THEMERADARS_API_KEY: ${{ secrets.THEMERADARS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Free tier is 100 requests/day. The list endpoint costs 4; the rest goes
      # on backfilling presets we have never seen. Skipped if no key is set, so
      # the crawl below still runs.
      - name: Sync ThemeRadars cache
        if: ${{ env.THEMERADARS_API_KEY != '' }}
        env:
          THEMERADARS_BUDGET: '90'
        run: node scripts/sync-themeradars.mjs

      - name: Crawl theme detail pages
        run: node scripts/crawl-theme-details.mjs

      - name: Validate generated data
        run: node scripts/validate-data.mjs data/theme-details.json:1000 data/theme-details.meta.json

      - name: Commit Shopify theme details
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main || exit 1
            # Never merge generated data. Point the index at the remote tip and
            # stage only our freshly written files, leaving the working tree
            # alone: the commit becomes "remote state + our regenerated files".
            # A merge or rebase here can leave conflict markers *and* exit 0,
            # which is how markers once got committed.
            git reset --mixed origin/main || exit 1
            for f in data/theme-details.json data/theme-details.meta.json data/themeradars.json; do
              [ -f "$f" ] && { git add -- "$f" || exit 1; }
            done

            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: update Shopify theme details" || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (remote moved during the run); retrying."
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
