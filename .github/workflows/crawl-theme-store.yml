name: Crawl Shopify Theme Store

on:
  schedule:
    - cron: '0 * * * *' # hourly, on the hour (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-theme-store
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Crawl theme store
        run: node scripts/crawl-theme-store.mjs

      - name: Validate generated data
        run: node scripts/validate-data.mjs data/theme-rankings.json:1000 data/theme-rankings.meta.json

      - name: Commit Shopify theme store rankings
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main || exit 1
            # Never merge generated data. Point the index at the remote tip and
            # stage only our freshly written files, leaving the working tree
            # alone: the commit becomes "remote state + our regenerated files".
            # A merge or rebase here can leave conflict markers *and* exit 0,
            # which is how markers once got committed.
            git reset --mixed origin/main || exit 1
            for f in data/theme-rankings.json data/theme-rankings.meta.json; do
              [ -f "$f" ] && { git add -- "$f" || exit 1; }
            done

            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: update Shopify theme store rankings" || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (remote moved during the run); retrying."
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
